http:
  routers:
    # github.com/changkun/website: the site, and each folder of
    # /www/changkun.de at its own path, such as research and the blog.
    to-website:
      rule: "Host(`localhost`)"
      middlewares:
        - website-errorpages
      service: website
    # github.com/changkun/redir
    to-redir:
      rule: "Host(`localhost`)&&PathRegexp(`^/[srx](/.*)?$`)"
      middlewares:
        - website-errorpages
      service: redir
    to-urlstat:
      rule: "Host(`localhost`)&&(Path(`/urlstat`)||PathPrefix(`/urlstat/`))"
      middlewares:
        - website-errorpages
      service: urlstat
    # github.com/changkun/midgard
    to-midgard:
      rule: "Host(`localhost`)&&PathPrefix(`/midgard`)"
      middlewares:
        - website-errorpages
      service: midgard
    # github.com/changkun/go-under-the-hood
    to-golang:
      rule: "Host(`localhost`)&&(Path(`/golang`)||PathPrefix(`/golang/`))"
      middlewares:
        - golang-redirector
      service: website
    # github.com/changkun/ssaplayground
    to-gossa:
      rule: "Host(`localhost`)&&(Path(`/gossa`)||PathPrefix(`/gossa/`))"
      middlewares:
        - gossa-redirector
      service: gossa
    dashboard:
      rule: Host(`traefik.changkun.de`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      service: api@internal
      middlewares:
        - auth
  middlewares:
    golang-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/golang(.*)"
        replacement: "https://golang.design/under-the-hood/${2}"
        permanent: true
    gossa-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/gossa(.*)"
        replacement: "https://golang.design/gossa/${2}"
        permanent: true
    us-redirector:
      redirectRegex:
        regex: "^(.*)changkun.us/(.*)"
        replacement: "https://blog.changkun.de/${2}"
        permanent: true
    website-errorpages:
      errors:
        status:
          - "404"
        service: website
        query: "/404.html"
    auth:
      basicAuth:
        users:
          - "changkun:$2y$05$LDfRDyrTzFVaTw.KKz/9I.7Ko/OvZv2MBj9tWM4bf2VMu08xoATiK"
  services:
    website:
      loadBalancer:
        servers:
        - url: http://website
    redir:
      loadBalancer:
        servers:
        - url: http://redir
    urlstat:
      loadBalancer:
        servers:
        - url: http://urlstat
    midgard:
      loadBalancer:
        servers:
        - url: http://midgard
    gossa:
      loadBalancer:
        servers:
        - url: http://gossa
