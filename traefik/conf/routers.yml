http:
  routers:
    # github.com/changkun/website: the site, and each folder of
    # /www/changkun.de at its own path, such as the books, the blog, and
    # research.
    to-website:
      rule: Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`)
      priority: 1
      tls:
        certResolver: changkunResolver
      middlewares:
        - gzipcompress
        - website-errorpages
      service: website
    # research relevant redirectors
    to-talks:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&(Path(`/talks`)||PathPrefix(`/talks/`)||Path(`/talk`)||PathPrefix(`/talk/`)||PathPrefix(`/teach`)||PathPrefix(`/teach/`)||PathPrefix(`/thesis`)||PathPrefix(`/thesis/`)||PathPrefix(`/theses`)||PathPrefix(`/theses/`)||PathPrefix(`/papers`)||PathPrefix(`/papers/`)||PathPrefix(`/paper`)||PathPrefix(`/paper/`))
      tls:
        certResolver: changkunResolver
      middlewares:
        - talks-redirector
        - talk-redirector
        - teach-redirector
        - theses-redirector
        - thesis-redirector
        - papers-redirector
        - paper-redirector
      service: website
    # ideas redirector
    to-ideas:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&(Path(`/ideas`)||PathPrefix(`/ideas/`))
      tls:
        certResolver: changkunResolver
      middlewares:
        - ideas-redirector
      service: website
    # The rankui demo moved from /research/rankui to /rankui.
    to-research-rankui:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&(Path(`/research/rankui`)||PathPrefix(`/research/rankui/`))
      tls:
        certResolver: changkunResolver
      middlewares:
        - rankui-redirector
      service: website
    # github.com/changkun/blog
    to-blog:
      rule: Host(`blog.changkun.de`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - blog-redirector
      service: website
    to-us:
      rule: Host(`changkun.us`) || Host(`www.changkun.us`) || Host(`ou.changkun.us`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - us-redirector
      service: website
    # api.changkun.de
    to-api:
      rule: Host(`api.changkun.de`)
      priority: 1
      tls:
        certResolver: changkunResolver
      service: website
    # github.com/changkun/urlstat
    to-urlstat:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&PathPrefix(`/urlstat`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - website-errorpages
      service: urlstat
    # github.com/changkun/redir
    to-redir:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&PathRegexp(`^/[srx](/.*)?$`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - website-errorpages
      service: redir

    # github.com/changkun/midgard
    to-midgard:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&PathPrefix(`/midgard`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - website-errorpages
      service: midgard
    # github.com/changkun/upbot
    to-upbot:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&PathPrefix(`/upbot`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - website-errorpages
      service: upbot
    # github.com/changkun/go-under-the-hood
    to-golang:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`))&&PathPrefix(`/golang`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - golang-redirector
      service: website
    # github.com/golang-design/ssaplayground
    to-gossa:
      rule: (Host(`changkun.de`) || Host(`ou.changkun.de`) || Host(`www.changkun.de`) || Host(`golang.design`) || Host(`www.golang.design`))&&(Path(`/gossa`)||PathPrefix(`/gossa/`))
      tls:
        certResolver: changkunResolver
      service: gossa
    # poly.red, the import path of github.com/changkun/polyred, which
    # changkun/redir answers for as one of its sites.
    to-polyred:
      rule: Host(`poly.red`)
      tls:
        certResolver: changkunResolver
      middlewares:
        - gzipcompress
      service: redir
    # github.com/changkun/rankui-v2
    # The study page for participants, under a domain that does not name
    # its author. Its longer rule takes the path from the import path.
    to-rankui-study:
      rule: Host(`poly.red`)&&(Path(`/study`)||PathPrefix(`/study/`))
      tls:
        certResolver: changkunResolver
      middlewares:
        - gzipcompress
      service: rankui-study
    # Served by changkun/redir, which keys links and visits by hostname
    # and so serves both sites from one process. The golang.design fork
    # it replaced is retired; see specs/004-unify-golang-design.md there.
    to-golangdesign-redir:
      rule: (Host(`golang.design`) || Host(`www.golang.design`)) && PathRegexp(`^/[sx](/.*)?$`)
      service: redir
      tls:
        certResolver: golangdesignResolver
      middlewares:
        - golang-errorpages
    # github.com/golang-design/website
    # github.com/golang-design/research
    # github.com/golang-design/under-the-hood
    # github.com/golang-design/go-questions
    to-golangdesign:
      rule: Host(`golang.design`) || Host(`www.golang.design`)
      priority: 1
      tls:
        certResolver: golangdesignResolver
      middlewares:
        - gzipcompress
        - golang-errorpages
      service: website
  middlewares:
    talks-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/talks(.*)"
        replacement: "https://changkun.de/research/talks${2}"
        permanent: true
    talk-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/talk/(.*)"
        replacement: "https://changkun.de/research/talks/${2}"
        permanent: true
    teach-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/teach(.*)"
        replacement: "https://changkun.de/research/teach${2}"
        permanent: true
    theses-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/theses(.*)"
        replacement: "https://changkun.de/research/theses${2}"
        permanent: true
    thesis-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/thesis(.*)"
        replacement: "https://changkun.de/research/theses${2}"
        permanent: true
    papers-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/papers(.*)"
        replacement: "https://changkun.de/research/papers${2}"
        permanent: true
    paper-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/paper/(.*)"
        replacement: "https://changkun.de/research/papers/${2}"
        permanent: true
    golang-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/golang(.*)"
        replacement: "https://golang.design/under-the-hood/${2}"
        permanent: true
    us-redirector:
      redirectRegex:
        regex: "^(.*)changkun.us/(.*)"
        replacement: "https://changkun.de/blog/${2}"
        permanent: true
    blog-redirector:
      redirectRegex:
        regex: "^(.*)blog.changkun.de/(.*)"
        replacement: "https://changkun.de/blog/${2}"
        permanent: true
    ideas-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/ideas(.*)"
        replacement: "https://changkun.de/blog/ideas${2}"
        permanent: true
    rankui-redirector:
      redirectRegex:
        regex: "^(.*)changkun.de/research/rankui(.*)"
        replacement: "https://changkun.de/rankui${2}"
        permanent: true
    website-errorpages:
      errors:
        status:
          - "404"
        service: website
        query: "/404.html"
    golang-errorpages:
      errors:
        status:
          - "404"
        service: website
        query: "/404.html"
    # Text only: PDFs, images, and audio are compressed already, and
    # compressing them on the fly would also lose range requests.
    gzipcompress:
      compress:
        includedContentTypes:
          - text/html
          - text/css
          - text/plain
          - text/csv
          - text/xml
          - text/javascript
          - application/javascript
          - application/json
          - application/xml
          - application/rss+xml
          - application/atom+xml
          - application/wasm
          - image/svg+xml
  services:
    website:
      loadBalancer:
        servers:
        - url: http://website
    redir:
      loadBalancer:
        servers:
        - url: http://redir
    urlstat:
      loadBalancer:
        servers:
        - url: http://urlstat
    midgard:
      loadBalancer:
        servers:
        - url: http://midgard
    upbot:
      loadBalancer:
        servers:
        - url: http://upbot
    gossa:
      loadBalancer:
        servers:
        - url: http://gossa
    rankui-study:
      loadBalancer:
        servers:
        - url: http://rankui-study:8080
