# Traefik writes its access log without rotating it. Left alone it reached
# 2.1 GB over six months, which is most of a small host's free space.
#
# copytruncate rather than a rename: traefik holds the file open, so a
# renamed log would keep receiving writes under a name nothing reads.
/root/changkun.de/proxy/traefik/logs/access.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}

/root/changkun.de/proxy/traefik/logs/traefik.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
    copytruncate
    su root root
}
